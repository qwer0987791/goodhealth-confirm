services:
  - type: web
    name: goodhealth-confirm
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    domains:
      - confirm.goodhealth-tw.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goodhealth-confirm-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: goodhealth-confirm-db
    plan: free
    region: singapore
    databaseName: goodhealth_confirm
    user: goodhealth_confirm
