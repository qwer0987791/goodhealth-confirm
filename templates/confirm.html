<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰鬥陀螺挑戰營</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827;display:flex;min-height:100vh;align-items:center;justify-content:center}.box{width:min(88%,420px);background:#fff;border-radius:22px;padding:32px;box-shadow:0 10px 30px #00000014;text-align:center}.brand{font-size:22px;font-weight:900;letter-spacing:1px;margin-bottom:28px}.choices{display:grid;gap:14px}button{border:0;border-radius:14px;padding:16px 24px;font-size:18px;font-weight:800;cursor:pointer;width:100%}.yes{background:#111827;color:#fff}.no{background:#eef0f3;color:#374151}.done{font-size:24px;font-weight:900;margin-top:10px}.sub{margin-top:12px;color:#6b7280;font-size:15px}</style></head><body><div class="box"><div class="brand">戰鬥陀螺挑戰營</div>{% if person.attendance_status=='attending' %}<div class="done">✓ 確認參加</div>{% elif person.attendance_status=='declined' %}<div class="done">已回覆不克前往</div>{% else %}<form method="post"><div class="choices"><button class="yes" name="action" value="attending">確認參加</button><button class="no" name="action" value="declined">不克前往</button></div></form>{% endif %}</div></body></html>
