<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知確認</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7fb;color:#111827;display:flex;min-height:100vh;align-items:center;justify-content:center}.box{width:min(88%,440px);background:#fff;border-radius:22px;padding:32px;box-shadow:0 10px 30px #00000014;text-align:center}.brand{font-size:13px;letter-spacing:2px;color:#6b7280}.name{font-size:24px;font-weight:800;margin:20px 0}p{color:#6b7280;line-height:1.7}button{border:0;border-radius:14px;padding:15px 24px;background:#111827;color:#fff;font-size:17px;font-weight:700;cursor:pointer;width:100%}.done{padding:15px;background:#ecfdf5;color:#047857;border-radius:14px;font-weight:800}</style></head><body><div class="box"><div class="brand">GOODHEALTH</div>{% if person.confirmed %}<h1>確認完成</h1><div class="name">{{person.name}}</div><div class="done">✓ 已確認收到</div><p>確認時間：{{person.confirmed_at}}</p>{% else %}<h1>通知確認</h1><div class="name">{{person.name}} 您好</div><p>請點擊下方按鈕，確認您已收到本次通知。</p><form method="post"><button>✓ 我已收到並確認</button></form>{% endif %}</div></body></html>
